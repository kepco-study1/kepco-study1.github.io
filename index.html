<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한전 뉴스·이슈 정리</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280;
    --line: #e5e7eb; --accent: #0b5cad; --news: #0b5cad; --issue: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e6e8ec; --muted: #9aa3b2;
      --line: #2c323d; --accent: #6aa9ec; --news: #6aa9ec; --issue: #f0965f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; line-height: 1.5; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { margin: 0 0 28px; color: var(--muted); font-size: 14px; }
  section { margin-bottom: 40px; }
  h2 { display: flex; align-items: center; gap: 8px; font-size: 20px; margin: 0 0 12px; }
  h2 .count { font-size: 13px; font-weight: 500; color: var(--muted); }
  h2::before { content: ""; width: 6px; height: 20px; border-radius: 3px; background: var(--c); }
  .table-box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { padding: 12px 14px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.date { white-space: nowrap; color: var(--muted); font-size: 14px; width: 104px; }
  td.img { width: 112px; }
  td.img img { width: 96px; height: 64px; object-fit: cover; border-radius: 6px; display: block; cursor: zoom-in; }
  td.title { font-weight: 600; width: 28%; }
  td.comment { white-space: pre-line; font-size: 14px; }
  td.link { white-space: nowrap; width: 80px; }
  td.link a { color: var(--accent); text-decoration: none; font-weight: 600; }
  td.link a:hover { text-decoration: underline; }
  .none { color: var(--muted); }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none;
    align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
  #viewer img { max-width: 100%; max-height: 100%; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>한전 뉴스·이슈 정리</h1>
  <p class="sub">한국전력 스터디 · 최신순</p>

  <section style="--c: var(--issue)">
    <h2>이슈 <span class="count" id="issue-count"></span></h2>
    <div class="table-box" id="issue"></div>
  </section>

  <section style="--c: var(--news)">
    <h2>뉴스 <span class="count" id="news-count"></span></h2>
    <div class="table-box" id="news"></div>
  </section>
</div>
<div id="viewer"><img alt=""></div>

<script src="data.js"></script>
<script>
  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function render(type, boxId, countId) {
    const rows = DATA.filter(d => d.type === type).sort((a, b) => b.date.localeCompare(a.date));
    document.getElementById(countId).textContent = rows.length + "건";
    const box = document.getElementById(boxId);
    if (!rows.length) { box.innerHTML = '<div class="empty">아직 등록된 항목이 없습니다.</div>'; return; }
    box.innerHTML = `<table>
      <thead><tr><th>날짜</th><th>사진</th><th>제목</th><th>한줄평</th><th>링크</th></tr></thead>
      <tbody>${rows.map(d => `<tr>
        <td class="date">${esc(d.date)}</td>
        <td class="img">${d.image ? `<img src="${esc(d.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith('-')">` : '<span class="none">-</span>'}</td>
        <td class="title">${esc(d.title)}</td>
        <td class="comment">${d.comment ? esc(d.comment) : '<span class="none">-</span>'}</td>
        <td class="link">${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">기사 보기</a>` : '<span class="none">-</span>'}</td>
      </tr>`).join("")}</tbody>
    </table>`;
  }

  render("이슈", "issue", "issue-count");
  render("뉴스", "news", "news-count");

  const viewer = document.getElementById("viewer");
  document.addEventListener("click", e => {
    if (e.target.matches("td.img img")) {
      viewer.querySelector("img").src = e.target.src;
      viewer.style.display = "flex";
    } else if (e.target.closest("#viewer")) {
      viewer.style.display = "none";
    }
  });
</script>
</body>
</html>
